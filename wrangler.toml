name = "oguzhangunay-site"
compatibility_date = "2026-08-01"
pages_build_output_dir = "."

# Cloudflare Pages manages this project's bindings through this file (not
# the dashboard UI) once it detects wrangler.toml — so these must be here
# with real resource identifiers, not placeholders.
[[kv_namespaces]]
binding = "SITE_KV"
id = "6f24a5f364ef474bb17ed9bab2c9229e"

[[r2_buckets]]
binding = "SITE_IMAGES"
bucket_name = "oguzhan-site-images"
