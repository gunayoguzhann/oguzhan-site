name = "oguzhangunay-site"
compatibility_date = "2026-08-01"
pages_build_output_dir = "."

# KV (binding: SITE_KV) and R2 (binding: SITE_IMAGES) are bound via the
# Cloudflare Pages dashboard (Settings > Bindings) for the deployed site —
# intentionally NOT declared here. Cloudflare Pages reads this file during
# real deployments (not just local dev), and a placeholder/fake resource ID
# here breaks the actual deploy ("Invalid KV namespace ID").
#
# For local testing with `wrangler pages dev`, pass bindings as CLI flags
# instead of putting them in this file:
#   wrangler pages dev . --kv SITE_KV --r2 SITE_IMAGES
